services:
  api:
    build:
      context: ./backend
    ports:
      - "${PORT}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://pybudo:pybudo@db:5432/pybudo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "{POSTGRES_USER}"
      POSTGRES_PASSWORD: "{POSTGRES_PASSWORD}"
      POSTGRES_DB: "{POSTGRES_DB}"
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pybudo -d pybudo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: