name: pyBudo CI/CD

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-main-from-dev:
    name: Enforce PR to main comes from dev
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Les PR vers main doivent venir de dev (branche source détectée : ${{ github.head_ref }})."
            exit 1
          fi
          echo "OK : PR vers main depuis dev."

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-backend:
    name: CI - Backend (FastAPI)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/**/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Check formatting
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff format --check .
          else
            echo "ruff not installed - skipping format check"
          fi

      - name: Lint
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "ruff not installed - skipping lint"
          fi

      - name: Type checking
        run: |
          if command -v mypy >/dev/null 2>&1; then
            mypy .
          else
            echo "mypy not installed - skipping type checking"
          fi

      - name: Tests
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest
          else
            echo "pytest is not installed"
            exit 1
          fi

  ci-frontend:
    name: CI - Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type checking
        run: npm run typecheck --if-present

      - name: Tests
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present

  build-backend-image:
    name: Build & push backend image
    needs: [changes, ci-backend, secrets-scan]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.secrets-scan.result == 'success' &&
      needs.changes.outputs.backend == 'true' &&
      needs.ci-backend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}

  build-frontend-image:
    name: Build & push frontend image
    needs: [changes, ci-frontend, secrets-scan]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.secrets-scan.result == 'success' &&
      needs.changes.outputs.frontend == 'true' &&
      needs.ci-frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}

  deploy-staging:
    name: CD - Deploy staging
    needs: [build-backend-image, build-frontend-image]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.build-backend-image.result != 'failure' &&
      needs.build-frontend-image.result != 'failure'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "CI/build passed on dev."
          echo "TODO: brancher la commande de déploiement staging (SSH+docker compose pull, Kubernetes, PaaS, etc.)."
          echo "Images disponibles : ghcr.io/${{ github.repository }}/backend:${{ github.sha }} et .../frontend:${{ github.sha }}"

  deploy-production:
    name: CD - Deploy production
    needs: [build-backend-image, build-frontend-image]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-backend-image.result != 'failure' &&
      needs.build-frontend-image.result != 'failure'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "CI/build passed on main."
          echo "TODO: brancher la commande de déploiement production."
          echo "Utiliser la protection d'environnement GitHub pour exiger une approbation manuelle si besoin."
          echo "Images disponibles : ghcr.io/${{ github.repository }}/backend:${{ github.sha }} et .../frontend:${{ github.sha }}"